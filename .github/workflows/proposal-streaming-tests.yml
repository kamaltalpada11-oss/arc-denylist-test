name: Proposal Stream Unit Tests

on:
  workflow_dispatch:

jobs:
  streaming-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout exact Arc source commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: circlefin/arc-node
          ref: 6e764023ee6515fe70573e123ed2db912a7207b4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev zlib1g-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Record source revision, toolchain, and runner disk
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
          df -h

      - name: Run focused proposal-stream tests
        run: cargo test --locked -p arc-node-consensus streaming::tests -j 2 -- --nocapture
